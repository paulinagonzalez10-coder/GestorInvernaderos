<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../CSS/colorLogin.css">
  <link rel="stylesheet" href="../../CSS/global.css">
  <title>Iniciar sesión - Invernadero</title>
  <script defer src="../../JS/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <main id="login">
    <h1>&#x1FAB4; Invernadero</h1>
    <p>Inicia sesión para continuar</p>
    <p class="muted">Acceso de demostración: no es autenticación segura.</p>
    <form x-data="login()" @submit.prevent="ingresar()" novalidate> <!--agregando los errores de validacion-->
      <div>
        <label for="usuario">Correo electrónico</label>
        <input type="email" id="usuario" autocomplete="off" x-model="correo" required
               :aria-invalid="ariaInvalido('correo')" aria-describedby="error-usuario">
        <p class="campo-error" id="error-usuario" x-show="errores.correo" x-text="errores.correo"></p>
      </div>
      <div>
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" autocomplete="off" minlength="4" x-model="clave" required
               :aria-invalid="ariaInvalido('clave')" aria-describedby="error-clave">
        <p class="campo-error" id="error-clave" x-show="errores.clave" x-text="errores.clave"></p>
      </div>
      <p class="error-general" role="alert" x-show="error" x-text="error"></p>
      <button type="submit" class="button-primario">Ingresar</button>
    </form>
    <div class="demo-section">
      <p class="demo-title">Acceso rápido de demostración</p>
      <div class="demo-action">
        <a href="Usuario/dashboard.html" class="button button-secundario">Ver como Usuario</a>
        <a href="Admin/admin.html" class="button button-secundario">Ver como Administrador</a>
      </div>
    </div>
  </main>
</body>
</html>
